AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Solución Serverless para AWS Academy: S3 + API Gateway REST + Lambda + DynamoDB.
  Usa LabRole existente. Incluye Custom Resource que sube los HTML al bucket S3
  automáticamente durante el despliegue, con la URL de la API ya inyectada.

# ============================================================
# PARÁMETROS
# ============================================================
Parameters:

  ProjectName:
    Type: String
    Default: mis-vehiculos
    Description: Nombre base del proyecto (prefijo en los recursos)

  StageName:
    Type: String
    Default: v1
    AllowedValues: [v1, v2, prod, dev]
    Description: Nombre del stage de API Gateway

  DynamoDBBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]
    Description: Modo de facturación de DynamoDB

  LabRoleName:
    Type: String
    Default: LabRole
    Description: >
      Nombre del rol IAM proporcionado por AWS Academy (normalmente "LabRole").
      El ARN se construye automáticamente usando el Account ID de la cuenta activa.
      Puedes verificarlo en IAM > Roles > LabRole.

# ============================================================
# RECURSOS
# ============================================================
Resources:

  # ----------------------------------------------------------
  # 1. TABLA DYNAMODB
  # ----------------------------------------------------------
  VehiculosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-vehiculos"
      BillingMode: !Ref DynamoDBBillingMode
      AttributeDefinitions:
        - AttributeName: record_type
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: record_type
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ----------------------------------------------------------
  # 2. FUNCIÓN LAMBDA PRINCIPAL (API de vehículos)
  # ----------------------------------------------------------
  VehiculosLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      Description: "API REST para gestión de vehículos con CORS habilitado (AWS Academy)"
      Runtime: python3.12
      Handler: index.lambda_handler
      # ARN construido automáticamente con el Account ID real de la cuenta activa.
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${LabRoleName}"
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref VehiculosTable
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import uuid
          from datetime import datetime

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          HEADERS = {
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Methods': 'GET, POST, PUT, OPTIONS',
              'Access-Control-Allow-Headers': 'Content-Type'
          }

          def lambda_handler(event, context):
              if event['httpMethod'] == 'OPTIONS':
                  return {'statusCode': 200, 'headers': HEADERS, 'body': json.dumps('OK')}
              http_method = event['httpMethod']
              path = event['path']
              if path == '/vehiculos':
                  if http_method == 'GET':
                      return listar_vehiculos()
                  elif http_method == 'POST':
                      return crear_vehiculo(json.loads(event['body']) if 'body' in event else {})
                  elif http_method == 'PUT':
                      return actualiza_vehiculo(json.loads(event['body']) if 'body' in event else {})
              elif path == '/':
                  if http_method == 'GET':
                      return {'statusCode': 200, 'headers': HEADERS,
                              'body': json.dumps({'message': 'Mis Vehiculos - Pagina principal'})}
              return {'statusCode': 404, 'headers': HEADERS, 'body': json.dumps({'error': 'Not Found'})}

          def crear_vehiculo(data):
              if not data:
                  return {'statusCode': 400, 'headers': HEADERS, 'body': json.dumps({'error': 'Missing request body'})}
              item = {'id': str(uuid.uuid4())[:10], 'record_type': 'vehiculo',
                      'createdAt': datetime.now().isoformat(), **data}
              table.put_item(Item=item)
              return {'statusCode': 201, 'headers': HEADERS, 'body': json.dumps(item)}

          def actualiza_vehiculo(data):
              if not data or 'id' not in data:
                  return {'statusCode': 400, 'headers': HEADERS, 'body': json.dumps({'error': 'Missing id'})}
              item_id = data['id']
              expr = 'SET updatedAt = :updatedAt'
              vals = {':updatedAt': datetime.now().isoformat()}
              for key, value in data.items():
                  if key != 'id':
                      expr += f', {key} = :{key}'
                      vals[f':{key}'] = value
              table.update_item(Key={'id': item_id, 'record_type': 'vehiculo'},
                                UpdateExpression=expr, ExpressionAttributeValues=vals,
                                ReturnValues='ALL_NEW')
              return {'statusCode': 200, 'headers': HEADERS,
                      'body': json.dumps({'id': item_id, 'message': 'vehiculo updated successfully'})}

          def listar_vehiculos():
              response = table.query(
                  KeyConditionExpression='record_type = :record_type_val',
                  ExpressionAttributeValues={':record_type_val': 'vehiculo'})
              return {'statusCode': 200, 'headers': HEADERS, 'body': json.dumps(response.get('Items', []))}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ----------------------------------------------------------
  # 3. API GATEWAY REST
  # ----------------------------------------------------------
  VehiculosApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-api"
      Description: "API REST para gestión de vehículos (AWS Academy)"
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  VehiculosResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VehiculosApi
      ParentId: !GetAtt VehiculosApi.RootResourceId
      PathPart: vehiculos

  VehiculosGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VehiculosApi
      ResourceId: !Ref VehiculosResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations"
          - LambdaArn: !GetAtt VehiculosLambda.Arn

  VehiculosPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VehiculosApi
      ResourceId: !Ref VehiculosResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations"
          - LambdaArn: !GetAtt VehiculosLambda.Arn

  VehiculosPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VehiculosApi
      ResourceId: !Ref VehiculosResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations"
          - LambdaArn: !GetAtt VehiculosLambda.Arn

  VehiculosOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VehiculosApi
      ResourceId: !Ref VehiculosResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  RootGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VehiculosApi
      ResourceId: !GetAtt VehiculosApi.RootResourceId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations"
          - LambdaArn: !GetAtt VehiculosLambda.Arn

  RootOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VehiculosApi
      ResourceId: !GetAtt VehiculosApi.RootResourceId
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - VehiculosGetMethod
      - VehiculosPostMethod
      - VehiculosPutMethod
      - VehiculosOptionsMethod
      - RootGetMethod
      - RootOptionsMethod
    Properties:
      RestApiId: !Ref VehiculosApi
      Description: !Sub "Deployment inicial - ${ProjectName} (Academy)"

  # NOTA: Sin MethodSettings/LoggingLevel — requiere rol de cuenta IAM no disponible en Academy
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref VehiculosApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref StageName
      Description: !Sub "Stage ${StageName} - ${ProjectName} (Academy)"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt VehiculosLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${VehiculosApi}/*/*/*"

  # ----------------------------------------------------------
  # 4. BUCKET S3 PARA HOSTING WEB ESTÁTICO
  # ----------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-web-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: indexTabla.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"

  # ----------------------------------------------------------
  # 5. CLOUDWATCH LOG GROUP
  # ----------------------------------------------------------
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-api"
      RetentionInDays: 7

  # ----------------------------------------------------------
  # 6. LAMBDA AUXILIAR — sube los HTML al bucket S3
  #
  # Esta Lambda se invoca una sola vez como Custom Resource durante
  # el despliegue del stack. Recibe el contenido HTML con la URL
  # real de la API ya sustituida y lo escribe en el bucket S3.
  # Se elimina automáticamente al borrar el stack.
  # ----------------------------------------------------------
  S3UploaderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-s3-uploader"
      Description: "Custom Resource: sube los archivos HTML al bucket S3 durante el despliegue"
      Runtime: python3.12
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${LabRoleName}"
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] in ('Create', 'Update'):
                      s3 = boto3.client('s3')
                      bucket = event['ResourceProperties']['BucketName']
                      files  = event['ResourceProperties']['Files']
                      # files es una lista de {Key, Content, ContentType}
                      for f in files:
                          s3.put_object(
                              Bucket=bucket,
                              Key=f['Key'],
                              Body=f['Content'].encode('utf-8'),
                              ContentType=f['ContentType']
                          )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(f"ERROR: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  # Permiso para que CloudFormation invoque la Lambda auxiliar
  S3UploaderLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt S3UploaderLambda.Arn
      Action: lambda:InvokeFunction
      Principal: cloudformation.amazonaws.com

  # Custom Resource: se ejecuta al crear/actualizar el stack.
  # Sube index.html e indexTabla.html al bucket con la URL real de la API.
  UploadWebFiles:
    Type: Custom::S3Upload
    DependsOn:
      - WebsiteBucketPolicy
      - ApiStage
      - S3UploaderLambdaPermission
    Properties:
      ServiceToken: !GetAtt S3UploaderLambda.Arn
      BucketName: !Ref WebsiteBucket
      # Forzar re-ejecución si cambia la URL de la API (p.ej. al actualizar el stack)
      ApiUrl: !Sub "https://${VehiculosApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/vehiculos"
      Files:
        - Key: index.html
          ContentType: text/html
          Content: !Sub |
            <!DOCTYPE html>
            <html lang="es">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Probador de API Vehículos</title>
                <style>
                    body { font-family: sans-serif; margin: 0; line-height: 1.6; background-color: #f0f2f5; }
                    .container { max-width: 600px; margin: 30px auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: white; }
                    button { padding: 10px 15px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; margin-right: 5px; }
                    button:hover { background-color: #0056b3; }
                    pre { background: #f4f4f4; padding: 10px; border: 1px solid #ddd; overflow-x: auto; min-height: 100px; }
                    .status { font-weight: bold; margin-bottom: 10px; }
                    nav { background-color: #1a73e8; padding: 0 24px; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
                    nav .nav-brand { color: white; font-weight: 700; font-size: 1rem; padding: 14px 12px 14px 0; margin-right: 12px; border-right: 1px solid rgba(255,255,255,0.3); white-space: nowrap; }
                    nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 14px 16px; font-size: 0.9rem; font-weight: 500; border-radius: 4px; transition: background 0.2s; white-space: nowrap; }
                    nav a:hover { background: rgba(255,255,255,0.15); color: white; }
                    nav a.active { background: rgba(255,255,255,0.2); color: white; font-weight: 700; }
                </style>
            </head>
            <body>
            <nav>
                <span class="nav-brand">Mis Vehículos</span>
                <a href="index.html" class="active">Probador API</a>
                <a href="indexTabla.html">Panel de Vehículos</a>
                <a href="altavehiculo.html">Alta de Vehículo</a>
            </nav>
            <div class="container">
                <h2>Prueba de API Gateway</h2>
                <div class="status" id="status">Estado: Esperando acción...</div>
                <button onclick="raiz()">Raiz</button>
                <button onclick="listarVehiculos()">Listar Vehículos</button>
                <button onclick="actualizarVehiculo()" style="background-color: #28a745;">Actualizar Vehículo (Mock)</button>
                <h3>Resultado:</h3>
                <pre id="resultado">Los datos aparecerán aquí...</pre>
            </div>
            <script>
                const API_URL = "https://${VehiculosApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/vehiculos";
                const API_URL_Base = "https://${VehiculosApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}";
                async function raiz() {
                    const statusDiv = document.getElementById('status');
                    const resDiv = document.getElementById('resultado');
                    statusDiv.innerText = "Estado: Cargando...";
                    resDiv.innerText = "";
                    try {
                        const response = await fetch(API_URL_Base);
                        const data = await response.json();
                        resDiv.innerText = JSON.stringify(data, null, 2);
                        statusDiv.innerText = "Estado: Éxito!";
                    } catch (error) {
                        resDiv.innerText = "Error: " + error.message;
                        statusDiv.innerText = "Estado: Error al conectar";
                    }
                }
                async function listarVehiculos() {
                    const statusDiv = document.getElementById('status');
                    const resDiv = document.getElementById('resultado');
                    statusDiv.innerText = "Estado: Cargando...";
                    resDiv.innerText = "";
                    try {
                        const response = await fetch(API_URL);
                        const data = await response.json();
                        resDiv.innerText = JSON.stringify(data, null, 2);
                        statusDiv.innerText = "Estado: Éxito!";
                    } catch (error) {
                        resDiv.innerText = "Error: " + error.message;
                        statusDiv.innerText = "Estado: Error al conectar";
                    }
                }
                async function actualizarVehiculo() {
                    const statusDiv = document.getElementById('status');
                    const resDiv = document.getElementById('resultado');
                    const vehiculoData = { id: "33c79a34-c", available: "False", nota: "En mantenimiento", modelo: "Cestna 172" };
                    statusDiv.innerText = "Estado: Actualizando...";
                    try {
                        const response = await fetch(API_URL, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(vehiculoData)
                        });
                        const data = await response.json();
                        resDiv.innerText = JSON.stringify(data, null, 2);
                        statusDiv.innerText = "Estado: Actualización completada";
                    } catch (error) {
                        resDiv.innerText = "Error: " + error.message;
                        statusDiv.innerText = "Estado: Error al actualizar";
                    }
                }
            </script>
            </body>
            </html>

        - Key: indexTabla.html
          ContentType: text/html
          Content: !Sub |
            <!DOCTYPE html>
            <html lang="es">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Gestión de Vehículos API</title>
                <style>
                    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f2f5; color: #333; }
                    .container { max-width: 900px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
                    h2 { color: #1a73e8; border-bottom: 2px solid #e8eaed; padding-bottom: 15px; margin-top: 0; }
                    .controls { margin: 20px 0; display: flex; gap: 12px; }
                    button { padding: 12px 24px; cursor: pointer; border: none; border-radius: 6px; font-weight: 600; transition: all 0.2s ease; font-size: 14px; }
                    .btn-list { background-color: #1a73e8; color: white; }
                    .btn-list:hover { background-color: #1557b0; }
                    .btn-update { background-color: #34a853; color: white; }
                    .btn-update:hover { background-color: #2d8e47; }
                    #status-bar { padding: 10px; margin-bottom: 20px; border-radius: 6px; font-size: 0.9em; background-color: #f8f9fa; border: 1px solid #ddd; }
                    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                    th, td { text-align: left; padding: 15px; border-bottom: 1px solid #eee; }
                    th { background-color: #f8f9fa; color: #5f6368; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
                    tr:hover { background-color: #f1f3f4; }
                    .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
                    .bg-available { background-color: #e6f4ea; color: #1e8e3e; }
                    .bg-maint { background-color: #fce8e6; color: #d93025; }
                    code { background: #f1f3f4; padding: 2px 5px; border-radius: 4px; font-family: monospace; }
                    nav { background-color: #1a73e8; padding: 0 24px; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
                    nav .nav-brand { color: white; font-weight: 700; font-size: 1rem; padding: 14px 12px 14px 0; margin-right: 12px; border-right: 1px solid rgba(255,255,255,0.3); white-space: nowrap; }
                    nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 14px 16px; font-size: 0.9rem; font-weight: 500; border-radius: 4px; transition: background 0.2s; white-space: nowrap; }
                    nav a:hover { background: rgba(255,255,255,0.15); color: white; }
                    nav a.active { background: rgba(255,255,255,0.2); color: white; font-weight: 700; }
                </style>
            </head>
            <body>
            <nav>
                <span class="nav-brand">Mis Vehículos</span>
                <a href="index.html">Probador API</a>
                <a href="indexTabla.html" class="active">Panel de Vehículos</a>
                <a href="altavehiculo.html">Alta de Vehículo</a>
            </nav>
            <div class="container">
                <h2>Panel de Vehículos</h2>
                <div id="status-bar">Sistema listo para conectar.</div>
                <div class="controls">
                    <button id="btnListar" class="btn-list">Listar Vehículos</button>
                    <button id="btnActualizar" class="btn-update">Actualizar Vehículo Prueba</button>
                </div>
                <div id="tabla-contenedor">
                    <p style="text-align: center; color: #70757a; margin-top: 40px;">Presiona "Listar" para cargar los datos desde AWS.</p>
                </div>
            </div>
            <script>
                const API_URL = "https://${VehiculosApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/vehiculos";
                async function obtenerDatos() {
                    const statusBar = document.getElementById('status-bar');
                    const contenedor = document.getElementById('tabla-contenedor');
                    statusBar.innerText = "Conectando con API Gateway...";
                    statusBar.style.color = "#1a73e8";
                    try {
                        const response = await fetch(API_URL);
                        if (!response.ok) throw new Error("Error servidor: " + response.status);
                        const vehiculos = await response.json();
                        renderizarTabla(vehiculos);
                        statusBar.innerText = "Datos actualizados correctamente.";
                        statusBar.style.color = "#34a853";
                    } catch (error) {
                        statusBar.innerText = "Error: " + error.message;
                        statusBar.style.color = "#d93025";
                        contenedor.innerHTML = "<p style='color:red;text-align:center;'>No se pudo cargar la información. Revisa CORS o la URL.</p>";
                    }
                }
                function renderizarTabla(lista) {
                    const contenedor = document.getElementById('tabla-contenedor');
                    if (lista.length === 0) { contenedor.innerHTML = "<p>No hay vehículos registrados.</p>"; return; }
                    let html = "<table><thead><tr><th>ID</th><th>Tipo</th><th>Matrícula</th><th>Disponible</th><th>Combustible</th></tr></thead><tbody>";
                    lista.forEach(v => {
                        const isAvailable = String(v.disponible).toLowerCase() === "true";
                        html += "<tr><td><code>" + v.id + "</code></td><td>" + (v.tipo||'-') + "</td><td>" + (v.matricula||'-') + "</td><td><span class='badge " + (isAvailable ? 'bg-available' : 'bg-maint') + "'>" + (isAvailable ? 'DISPONIBLE' : 'NO DISPONIBLE') + "</span></td><td>" + (v.combustible||'-') + "</td></tr>";
                    });
                    html += "</tbody></table>";
                    contenedor.innerHTML = html;
                }
                async function ejecutarActualizacion() {
                    const statusBar = document.getElementById('status-bar');
                    const payload = { id: "33c79a34-c", disponible: "False", nota: "En mantenimiento", tipo: "Coche" };
                    statusBar.innerText = "Enviando actualización...";
                    try {
                        const response = await fetch(API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        if (!response.ok) throw new Error("Error al actualizar");
                        alert("Vehículo actualizado con éxito!");
                        obtenerDatos();
                    } catch (error) { alert("Error: " + error.message); }
                }
                document.addEventListener("DOMContentLoaded", () => {
                    document.getElementById("btnListar").addEventListener("click", obtenerDatos);
                    document.getElementById("btnActualizar").addEventListener("click", ejecutarActualizacion);
                });
            </script>
            </body>
            </html>

        - Key: altavehiculo.html
          ContentType: text/html
          Content: !Sub |
            <!DOCTYPE html>
            <html lang="es">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Alta de Vehículo</title>
                <style>
                    * { box-sizing: border-box; margin: 0; padding: 0; }
                    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; min-height: 100vh; }
                    .page-wrapper { display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; }
                    .container { background: white; padding: 36px 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 520px; }
                    nav { background-color: #1a73e8; padding: 0 24px; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
                    nav .nav-brand { color: white; font-weight: 700; font-size: 1rem; padding: 14px 12px 14px 0; margin-right: 12px; border-right: 1px solid rgba(255,255,255,0.3); white-space: nowrap; }
                    nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 14px 16px; font-size: 0.9rem; font-weight: 500; border-radius: 4px; transition: background 0.2s; white-space: nowrap; }
                    nav a:hover { background: rgba(255,255,255,0.15); color: white; }
                    nav a.active { background: rgba(255,255,255,0.2); color: white; font-weight: 700; }
                    .subtitle { color: #70757a; font-size: 0.9rem; margin-bottom: 28px; border-bottom: 2px solid #e8eaed; padding-bottom: 16px; }
                    .form-group { margin-bottom: 20px; }
                    label { display: block; font-size: 0.85rem; font-weight: 600; color: #3c4043; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
                    label .required { color: #d93025; margin-left: 3px; }
                    input[type="text"], select { width: 100%; padding: 10px 14px; border: 1px solid #dadce0; border-radius: 6px; font-size: 0.95rem; color: #3c4043; transition: border-color 0.2s, box-shadow 0.2s; background-color: #fff; }
                    input[type="text"]:focus, select:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
                    input[type="text"]::placeholder { color: #bdc1c6; }
                    .form-row { display: flex; gap: 16px; }
                    .form-row .form-group { flex: 1; }
                    .btn-submit { width: 100%; padding: 13px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 8px; }
                    .btn-submit:hover { background-color: #1557b0; }
                    .btn-submit:disabled { background-color: #a8c7fa; cursor: not-allowed; }
                    #status-msg { margin-top: 20px; padding: 12px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; display: none; }
                    #status-msg.success { background-color: #e6f4ea; color: #1e8e3e; border: 1px solid #a8d5b5; display: block; }
                    #status-msg.error { background-color: #fce8e6; color: #d93025; border: 1px solid #f5c6c2; display: block; }
                    #status-msg.loading { background-color: #e8f0fe; color: #1a73e8; border: 1px solid #aecbfa; display: block; }
                    #respuesta-json { display: none; margin-top: 16px; }
                    #respuesta-json summary { cursor: pointer; font-size: 0.85rem; color: #70757a; user-select: none; }
                    #respuesta-json pre { background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 6px; padding: 12px; font-size: 0.82rem; overflow-x: auto; margin-top: 8px; color: #3c4043; }
                </style>
            </head>
            <body>
            <nav>
                <span class="nav-brand">Mis Vehículos</span>
                <a href="index.html">Probador API</a>
                <a href="indexTabla.html">Panel de Vehículos</a>
                <a href="altavehiculo.html" class="active">Alta de Vehículo</a>
            </nav>
            <div class="page-wrapper">
            <div class="container">
                <h2>Alta de Vehículo</h2>
                <p class="subtitle">Introduce los datos del nuevo vehículo para registrarlo en el sistema</p>
                <form id="formVehiculo" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tipo">Tipo <span class="required">*</span></label>
                            <select id="tipo" name="tipo" required>
                                <option value="" disabled selected>Selecciona...</option>
                                <option value="Coche">Coche</option>
                                <option value="Moto">Moto</option>
                                <option value="Scooter">Scooter</option>
                                <option value="Furgoneta">Furgoneta</option>
                                <option value="Camión">Camión</option>
                                <option value="Avión">Avión</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="combustible">Combustible <span class="required">*</span></label>
                            <select id="combustible" name="combustible" required>
                                <option value="" disabled selected>Selecciona...</option>
                                <option value="Gasolina">Gasolina</option>
                                <option value="Diésel">Diésel</option>
                                <option value="Eléctrico">Eléctrico</option>
                                <option value="Híbrido">Híbrido</option>
                                <option value="Hidrógeno">Hidrógeno</option>
                                <option value="Jet Fuel">Jet Fuel</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="matricula">Matrícula <span class="required">*</span></label>
                        <input type="text" id="matricula" name="matricula" placeholder="Ej: ABC-1234" required maxlength="10">
                    </div>
                    <div class="form-group">
                        <label for="modelo">Modelo</label>
                        <input type="text" id="modelo" name="modelo" placeholder="Ej: Toyota Corolla" maxlength="60">
                    </div>
                    <div class="form-group">
                        <label for="disponible">Disponibilidad <span class="required">*</span></label>
                        <select id="disponible" name="disponible" required>
                            <option value="True" selected>Disponible</option>
                            <option value="False">No disponible</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="nota">Nota</label>
                        <input type="text" id="nota" name="nota" placeholder="Observaciones opcionales..." maxlength="120">
                    </div>
                    <button type="submit" class="btn-submit" id="btnEnviar">Registrar Vehículo</button>
                </form>
                <div id="status-msg"></div>
                <details id="respuesta-json">
                    <summary>Ver respuesta del servidor</summary>
                    <pre id="json-output"></pre>
                </details>
            </div>
            </div>
            <script>
                const API_URL = "https://${VehiculosApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/vehiculos";
                const form      = document.getElementById('formVehiculo');
                const btnEnviar = document.getElementById('btnEnviar');
                const statusMsg = document.getElementById('status-msg');
                const respuesta = document.getElementById('respuesta-json');
                const jsonOut   = document.getElementById('json-output');
                function setStatus(type, message) { statusMsg.className = type; statusMsg.textContent = message; }
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const tipo        = document.getElementById('tipo').value.trim();
                    const combustible = document.getElementById('combustible').value.trim();
                    const matricula   = document.getElementById('matricula').value.trim();
                    const disponible  = document.getElementById('disponible').value;
                    if (!tipo || !combustible || !matricula) {
                        setStatus('error', 'Por favor, rellena todos los campos obligatorios (*).');
                        return;
                    }
                    const payload = { tipo, combustible, matricula, disponible };
                    const modelo = document.getElementById('modelo').value.trim();
                    const nota   = document.getElementById('nota').value.trim();
                    if (modelo) payload.modelo = modelo;
                    if (nota)   payload.nota   = nota;
                    btnEnviar.disabled = true;
                    btnEnviar.textContent = 'Enviando...';
                    setStatus('loading', 'Conectando con la API...');
                    respuesta.style.display = 'none';
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await response.json();
                        jsonOut.textContent = JSON.stringify(data, null, 2);
                        respuesta.style.display = 'block';
                        if (response.ok) {
                            setStatus('success', 'Vehículo registrado correctamente. ID asignado: ' + data.id);
                            form.reset();
                        } else {
                            setStatus('error', 'Error ' + response.status + ': ' + (data.error || 'Respuesta inesperada del servidor.'));
                        }
                    } catch (error) {
                        setStatus('error', 'No se pudo conectar con la API. Revisa la URL o la configuración CORS.');
                        console.error(error);
                    } finally {
                        btnEnviar.disabled = false;
                        btnEnviar.textContent = 'Registrar Vehículo';
                    }
                });
            </script>
            </body>
            </html>

# ============================================================
# OUTPUTS
# ============================================================
Outputs:

  ApiUrl:
    Description: "URL base de la API REST"
    Value: !Sub "https://${VehiculosApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  ApiVehiculosUrl:
    Description: "Endpoint /vehiculos de la API REST"
    Value: !Sub "https://${VehiculosApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/vehiculos"

  DynamoDBTableName:
    Description: "Nombre de la tabla DynamoDB"
    Value: !Ref VehiculosTable

  LambdaFunctionName:
    Description: "Nombre de la función Lambda principal"
    Value: !Ref VehiculosLambda

  WebsiteBucketName:
    Description: "Nombre del bucket S3"
    Value: !Ref WebsiteBucket

  WebsiteUrl:
    Description: "URL del sitio web estático en S3"
    Value: !GetAtt WebsiteBucket.WebsiteURL

  WebsiteUrlTabla:
    Description: "URL directa a la página de tabla de vehículos"
    Value: !Sub "${WebsiteBucket.WebsiteURL}/indexTabla.html"

  WebsiteUrlAltaVehiculo:
    Description: "URL directa al formulario de alta de vehículo"
    Value: !Sub "${WebsiteBucket.WebsiteURL}/altavehiculo.html"

  LabRoleUsed:
    Description: "ARN del LabRole utilizado por las funciones Lambda"
    Value: !Sub "arn:aws:iam::${AWS::AccountId}:role/${LabRoleName}"
